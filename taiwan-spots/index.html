const at=(K,x0,y0,z0,ry=0,s=1)=>{const co=Math.cos(ry),sn=Math.sin(ry);return(n,col,x,y,z,sx,sy=sx,sz=sx,r=0,rz=0)=>K.a(n,col,x0+(x*co+z*sn)*s,y0+y*s,z0+(-x*sn+z*co)*s,sx*s,sy*s,sz*s,ry+r,0,rz)};

function slot(c,a0,a1,r){for(let t=0;t<40;t++){const a=a0+c.R()*(a1-a0);if(!c.used.some(u=>Math.abs(Math.atan2(Math.sin(a-u),Math.cos(a-u)))<.34)){c.used.push(a);return[Math.cos(a)*r,Math.sin(a)*r,a,Math.atan2(-Math.cos(a),-Math.sin(a))]}}return null}

function wildlife(c,code,town,name){const R=c.R,list=[];
  if(/秀林|信義|仁愛|海端|卓溪|萬榮|太魯閣|合歡|玉山|雪霸|塔塔加|大霸/.test(town+name)||['10015'].includes(code)&&/山|森林/.test(name))list.push(['bear',1]);
  if(/恆春|社頂|墾丁|綠島|滿州/.test(town+name))list.push(['deer',2]);if(/柴山|壽山|鼓山|墾丁|猴|獼猴|烏來/.test(town+name))list.push(['monkey',2]);
  if(/七股|曾文溪|四草|鹽|濕地/.test(name+town)&&code==='67000')list.push(['spoonbill',3]);list.push(['magpie',R()<.6?1:0]);
  for(const[k,n]of list)for(let i=0;i<n;i++){const a=R()*6.283,r=9+R()*2.5,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(k==='bear')c.add(bear(),{m:'pace',x,z,dx:Math.sin(a),dz:-Math.cos(a),L:1.4,sp:.2,ph:i});else if(k==='deer')c.add(deer(),{m:'pace',x,z,dx:Math.sin(a),dz:-Math.cos(a),L:1.6,sp:.25,ph:i*2});
    else if(k==='monkey')c.add(monkey(),{m:'hop',x,y:.1,z,ph:R()*6});else if(k==='spoonbill')c.add(spoonbill(),{m:'pace',x:(R()-.5)*8,z:-4+(R()-.5)*4,dx:1,dz:0,L:1,sp:.2,ph:R()*6});else if(k==='magpie')c.add(magpie(),{m:'fly',r:7+R()*4,y:7+R()*2,sp:.5*(R()<.5?1:-1),ph:R()*6,flap:9})}}

function tripLegs(){const a=[];let p=here?[here.lat,here.lon]:null;for(const i of trip){const s=S[i];a.push(p?dkm(p[0],p[1],s[2],s[3]):0);p=[s[2],s[3]]}return a}
function gmSegs(){const pts=[];if(here)pts.push([here.lat,here.lon,here.n]);trip.forEach(i=>pts.push([S[i][2],S[i][3],S[i][1]]));

  const segs=[];for(let a=0;a<pts.length-1;a+=4){const b=Math.min(pts.length-1,a+4),mid=pts.slice(a+1,b);
    segs.push({u:`https://www.google.com/maps/dir/?api=1&origin=${pts[a][0]},${pts[a][1]}&destination=${pts[b][0]},${pts[b][1]}&travelmode=driving`+(mid.length?'&waypoints='+mid.map(p=>p[0]+','+p[1]).join('%7C'):''),from:pts[a][2],to:pts[b][2]})}return segs}
function tripTotals(){const L=tripLegs(),km_=L.reduce((a,b)=>a+b,0),mins=L.reduce((a,k)=>a+(k?driveMin(k):0),0);return{L,km:km_*RF,mins}}

function addTrip(id){const k=trip.indexOf(id);if(k>=0){trip.splice(k,1);saveTrip();toast('已移出行程');return}if(trip.length>=10){toast('行程最多 10 站，先移掉一站');return}trip.push(id);saveTrip();toast(`已加入行程（第 ${trip.length} 站）`)}
function optTrip(){const len=o=>{let t=0,p=here?[here.lat,here.lon]:null;for(const s of o){if(p)t+=dkm(p[0],p[1],s[2],s[3]);p=[s[2],s[3]]}return t};
  const pts=trip.map(i=>S[i]),fixed=here?0:1,before=len(pts),order=pts.slice(0,fixed),rest=pts.slice(fixed);let cur=here?[here.lat,here.lon]:[pts[0][2],pts[0][3]];

function tripFit(){const pts=trip.map(i=>spP(S[i])),hp=herePos();if(hp)pts.push([hp[0],hp[1]]);const xs=pts.map(p=>p[0]),zs=pts.map(p=>p[1]),pad=Math.max(12,(Math.max(...xs)-Math.min(...xs)+Math.max(...zs)-Math.min(...zs))*.12);

function buildRoute(){if(tripMesh){scene.remove(tripMesh);tripMesh.geometry.dispose();tripMesh=null}const pts=[],hp=herePos();if(hp)pts.push(new THREE.Vector3(hp[0],TOP,hp[1]));trip.forEach(i=>{const q=spP(S[i]);pts.push(new THREE.Vector3(q[0],TOP,q[1]))});if(pts.length<2)return;
  const parts=[],pink=new THREE.Color('#ff3d7f');for(let i=1;i<pts.length;i++){const a=pts[i-1].clone().setY(TOP+.8),b=pts[i].clone().setY(TOP+.8),L=a.distanceTo(b),m=a.clone().lerp(b,.5);m.y=TOP+Math.max(7,5+L*.42);

  tripMesh=new THREE.Mesh(mergeGeo(parts),mats.glow);tripMesh.frustumCulled=false;scene.add(tripMesh)}

  else if(c){const z=st.zone&&catBy[st.zone],a=sorted(z?c.spots.filter(s=>has(s,z)):c.spots);t=`${c.name}${z?'・'+z.n:''}${st.f?'・'+fname():''}景點（${a.length} 個）\n`+a.slice(0,10).map((s,i)=>`${i+1}. ${s[1]}（${s[5]}）`).join('\n')}else return;
  if(APP&&await shareText(t))return;
  try{await navigator.clipboard.writeText(t);toast('已複製，貼給朋友就能分享')}catch(e){openOv('分享內容',`<p class="hint">長按下方文字即可複製</p><textarea readonly>${esc(t)}</textarea>`)}}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-s],[data-ci],[data-k],[data-z]');if(!a)return;const act=a.dataset.act;
  if(a.dataset.k!==undefined){const d=chipDefs[+a.dataset.k];st.f=(d.t===null||st.f===d)?null:d;st.limit=40;applyFilter();if(st.spot>=0)renderCrumbs();return}
  if(a.dataset.s!==undefined){closeOv();return go('s-'+a.dataset.s)}
  if(a.dataset.z!==undefined){st.open=false;return go(`z-${G.counties[st.ci].code}-${a.dataset.z}`)}
  if(a.dataset.ci!==undefined){closeOv();return go('c-'+G.counties[+a.dataset.ci].code)}
  switch(act){case'home':closeOv();go('');break;case'region':openRegion();break;case'search':openSearch();break;case'about':openAbout();break;case'ovclose':closeOv();break;
    case'back':go(st.spot>=0?countyHash():st.zone?'c-'+G.counties[st.ci].code:'');break;case'county':go('c-'+G.counties[st.ci].code);break;case'zone':go(countyHash());break;case'share':share();break;
    case'toggle':st.open=!st.open;renderSheet();break;case'more':st.limit+=40;renderSheet();break;case'close':go(countyHash());break;
    case'north':flyTo({...cam,theta:0},700);break;case'desc':st.mini=!st.mini;renderCard();break;
    case'sound':sndToggle();break;case'near':openNear();break;case'plan':openTrip();break;case'gps':useGPS();break;case'pick':startPick();break;
    case'hset':{const h=a.dataset.h,i=+h.slice(1);if(h[0]==='t'){const t=M.towns[i];setHere({n:G.counties[t[0]].name+t[1],lat:t[2],lon:t[3]})}else{const sp=S[i];setHere({n:sp[1],lat:sp[2],lon:sp[3]})}renderNear();break}
    case'hhere':{const sp=S[st.spot];setHere({n:sp[1],lat:sp[2],lon:sp[3]});openNear();break}
    case'rad':nr=+a.dataset.r;renderNear();break;case'nfil':nf=a.dataset.f||null;renderNear();break;
    case'trip':addTrip(st.spot);break;case'tdel':trip.splice(+a.dataset.i,1);saveTrip();break;
    case'tup':case'tdn':{const i=+a.dataset.i,j=act==='tup'?i-1:i+1;if(j>=0&&j<trip.length){[trip[i],trip[j]]=[trip[j],trip[i]];saveTrip()}break}
    case'topt':optTrip();break;case'tshow':showRoute();break;case'thide':hideRoute();break;case'tcopy':copyTrip();break;case'copy':copyText(a.dataset.t,'地址已複製');break;
    case'tclear':if(clearArm){trip=[];saveTrip();hideRoute();toast('行程已清空')}else{clearArm=1;a.textContent='再按一次確認清空';setTimeout(()=>{clearArm=0;const b=$('#tclr');if(b)b.textContent='清空'},4000)}break;case'spin':st.spin=!st.spin;a.setAttribute('aria-pressed',String(st.spin));toast(st.spin?'自動旋轉中，再按一次停止':'已停止旋轉');break;
    case'mode':st.mode=st.mode==='isle'?'map':'isle';store.set('tw-mode',st.mode);st.zone=null;if(st.ci>=0){const h='c-'+G.counties[st.ci].code;closeSpot();if(location.hash.slice(1)!==h)go(h);else enter(st.ci,true)}toast(st.mode==='isle'?'特色島：每一區是一種特色':'實景地圖：小房子是景點的真實位置');break;
    case'fav':{const id=st.spot;favs.has(id)?favs.delete(id):favs.add(id);store.set('tw-favs',[...favs]);renderCard();updateChips();if(st.f&&st.f.t==='fav')applyFilter();toast(favs.has(id)?'已加入我的收藏':'已移出收藏');break}}});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#ov').classList.contains('on'))closeOv();else if(st.spot>=0)go(countyHash());else if(st.zone)go('c-'+G.counties[st.ci].code);else if(st.ci>=0)go('')});
}
</script>
